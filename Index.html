<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Online AI Tools PDF Compressor</title>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/4.10.38/pdf.min.mjs"
          type="module"></script>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
</head>

<body>

  <h1>Free PDF Compressor</h1>

  <input
    type="file"
    id="pdfFile"
    accept="application/pdf"
  >

  <br><br>

  <select id="quality">
    <option value="0.65">Normal</option>
    <option value="0.50" selected>Recommended</option>
    <option value="0.35">Strong</option>
  </select>

  <br><br>

  <button id="compressBtn">
    Compress PDF
  </button>

  <p id="status"></p>

  <div id="result"></div>


<script type="module">

const pdfjsLib = await import(
  "https://cdnjs.cloudflare.com/ajax/libs/pdf.js/4.10.38/pdf.min.mjs"
);

pdfjsLib.GlobalWorkerOptions.workerSrc =
  "https://cdnjs.cloudflare.com/ajax/libs/pdf.js/4.10.38/pdf.worker.min.mjs";

const { jsPDF } = window.jspdf;

const fileInput =
  document.getElementById("pdfFile");

const qualitySelect =
  document.getElementById("quality");

const compressBtn =
  document.getElementById("compressBtn");

const status =
  document.getElementById("status");

const result =
  document.getElementById("result");


compressBtn.addEventListener("click", async () => {

  const file = fileInput.files[0];

  if (!file) {
    status.textContent =
      "Please select a PDF first.";
    return;
  }

  compressBtn.disabled = true;

  result.innerHTML = "";

  try {

    const quality =
      Number(qualitySelect.value);

    status.textContent =
      "Loading PDF...";

    const buffer =
      await file.arrayBuffer();

    const pdf =
      await pdfjsLib.getDocument({
        data: buffer
      }).promise;

    let outputPDF = null;

    const scale = 0.75;


    for (
      let pageNumber = 1;
      pageNumber <= pdf.numPages;
      pageNumber++
    ) {

      status.textContent =
        "Processing page " +
        pageNumber +
        " of " +
        pdf.numPages;

      const page =
        await pdf.getPage(pageNumber);

      const viewport =
        page.getViewport({
          scale: scale
        });

      const canvas =
        document.createElement("canvas");

      canvas.width =
        Math.floor(viewport.width);

      canvas.height =
        Math.floor(viewport.height);

      const ctx =
        canvas.getContext("2d", {
          alpha: false
        });

      await page.render({
        canvasContext: ctx,
        viewport: viewport
      }).promise;


      const image =
        canvas.toDataURL(
          "image/jpeg",
          quality
        );


      const width =
        canvas.width;

      const height =
        canvas.height;

      const orientation =
        width > height
          ? "landscape"
          : "portrait";


      if (pageNumber === 1) {

        outputPDF =
          new jsPDF({
            orientation: orientation,
            unit: "px",
            format: [width, height],
            compress: true
          });

      } else {

        outputPDF.addPage(
          [width, height],
          orientation
        );

      }


      outputPDF.addImage(
        image,
        "JPEG",
        0,
        0,
        width,
        height,
        undefined,
        "FAST"
      );

    }


    const compressedBlob =
      outputPDF.output("blob");


    const originalSize =
      file.size;

    const compressedSize =
      compressedBlob.size;


    const originalMB =
      (originalSize / 1024 / 1024)
        .toFixed(2);

    const compressedMB =
      (compressedSize / 1024 / 1024)
        .toFixed(2);


    if (compressedSize >= originalSize) {

      status.textContent =
        "This PDF cannot be reduced using this method.";

      result.innerHTML = `
        <p>Original: ${originalMB} MB</p>
        <p>Generated: ${compressedMB} MB</p>
      `;

    } else {

      const saved =
        (
          (originalSize - compressedSize)
          / originalSize
          * 100
        ).toFixed(1);


      const url =
        URL.createObjectURL(
          compressedBlob
        );


      status.textContent =
        "Compression complete!";


      result.innerHTML = `

        <p>
          Original:
          <strong>${originalMB} MB</strong>
        </p>

        <p>
          Compressed:
          <strong>${compressedMB} MB</strong>
        </p>

        <p>
          Saved:
          <strong>${saved}%</strong>
        </p>

        <a
          href="${url}"
          download="compressed-${file.name}"
        >
          <button>
            Download Compressed PDF
          </button>
        </a>

      `;

    }

  } catch (error) {

    console.error(error);

    status.textContent =
      "Compression failed.";

  }

  compressBtn.disabled = false;

});

</script>

</body>
</html>
